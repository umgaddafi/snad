<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="snad-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#ea580c" flood-opacity="0.3" />
    </filter>
  </defs>
  
  <!-- Background Circle -->
  <rect width="512" height="512" rx="128" fill="url(#snad-grad)" />
  
  <!-- Steam Curves -->
  <path d="M190 140 Q 210 110 190 80" stroke="#ffffff" stroke-width="20" stroke-linecap="round" fill="none" opacity="0.9" />
  <path d="M256 120 Q 276 90 256 60" stroke="#ffffff" stroke-width="20" stroke-linecap="round" fill="none" opacity="0.95" />
  <path d="M322 140 Q 342 110 322 80" stroke="#ffffff" stroke-width="20" stroke-linecap="round" fill="none" opacity="0.9" />

  <!-- Food Bowl -->
  <path d="M112 220 H 400 C 400 340 336 410 256 410 C 176 410 112 340 112 220 Z" fill="#ffffff" filter="url(#shadow)" />
  
  <!-- Food Dome / Garnish -->
  <path d="M128 220 Q 256 160 384 220 Z" fill="#fb923c" />
  
  <!-- Fork & Spoon Symbol -->
  <circle cx="256" cy="300" r="28" fill="url(#snad-grad)" />
</svg>